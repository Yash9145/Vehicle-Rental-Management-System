{% extends "base.html" %}{% block title %}{{title}}{% endblock %}{% block heading %}{{title}}{% endblock %}{% block content %}<div class="formbox"><form method="post"><div class="grid">{% set val=vehicle or {} %}<label>Category<select name="category_id" required>{% for c in categories %}<option value="{{c.category_id}}" {% if vehicle and vehicle.category_id==c.category_id%}selected{%endif%}>{{c.category_name}} — ₹{{c.daily_rate}}/day</option>{% endfor %}</select></label><label>Vehicle Number<input name="vehicle_number" required value="{{val.vehicle_number or ''}}" placeholder="MH31AB1234"></label><label>Brand<input name="brand" required value="{{val.brand or ''}}"></label><label>Model<input name="model" required value="{{val.model or ''}}"></label><label>Manufacture Year<input type="number" name="manufacture_year" value="{{val.manufacture_year or ''}}"></label><label>Color<input name="color" value="{{val.color or ''}}"></label><label>Fuel<select name="fuel_type">{% for x in ['Petrol','Diesel','Electric','CNG','Hybrid']%}<option {% if val.fuel_type==x%}selected{%endif%}>{{x}}</option>{%endfor%}</select></label><label>Transmission<select name="transmission">{% for x in ['Manual','Automatic']%}<option {% if val.transmission==x%}selected{%endif%}>{{x}}</option>{%endfor%}</select></label><label>Seats<input type="number" name="seating_capacity" min="1" required value="{{val.seating_capacity or 5}}"></label><label>Status<select name="status">{% for x in ['Available','Rented','Maintenance']%}<option {% if val.status==x%}selected{%endif%}>{{x}}</option>{%endfor%}</select></label></div><div class="actionsbar"><a class="btn ghost" href="{{url_for('vehicles')}}">Cancel</a><button class="btn primary">Save Vehicle</button></div></form></div>{% endblock %}
