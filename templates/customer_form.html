{% extends "base.html" %}{% block title %}{{title}}{% endblock %}{% block heading %}{{title}}{% endblock %}{% block content %}<div class="formbox"><form method="post"><div class="grid"><label>Full Name<input name="full_name" required value="{{customer.full_name if customer else ''}}"></label><label>Email<input type="email" name="email" required value="{{customer.email if customer else ''}}"></label><label>Phone<input name="phone" required pattern="[0-9]{10,15}" value="{{customer.phone if customer else ''}}"></label><label>Driving Licence No.<input name="driving_license_no" required value="{{customer.driving_license_no if customer else ''}}"></label><label class="full">Address<textarea name="address">{{customer.address if customer else ''}}</textarea></label></div><div class="actionsbar"><a class="btn ghost" href="{{url_for('customers')}}">Cancel</a><button class="btn primary">Save Customer</button></div></form></div>{% endblock %}
